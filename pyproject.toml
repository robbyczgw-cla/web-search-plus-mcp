[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "web_search_plus_mcp/schemas"
"docs/MIGRATION_1_0.md" = "web_search_plus_mcp/docs/MIGRATION_1_0.md"
"docs/DONSETCH.md" = "web_search_plus_mcp/docs/DONSETCH.md"
"docs/RELEASE_4_0_0.md" = "web_search_plus_mcp/docs/RELEASE_4_0_0.md"
"docs/RELEASE_4_0_4.md" = "web_search_plus_mcp/docs/RELEASE_4_0_4.md"
"docs/RELEASE_4_0_5.md" = "web_search_plus_mcp/docs/RELEASE_4_0_5.md"
"docs/RELEASE_4_1_1.md" = "web_search_plus_mcp/docs/RELEASE_4_1_1.md"
"docs/RELEASE_4_1_0.md" = "web_search_plus_mcp/docs/RELEASE_4_1_0.md"
"docs/RELEASE_1_2.md" = "web_search_plus_mcp/docs/RELEASE_1_2.md"
"docs/RELEASE_3_3.md" = "web_search_plus_mcp/docs/RELEASE_3_3.md"
"docs/RELEASE_3_4.md" = "web_search_plus_mcp/docs/RELEASE_3_4.md"
"docs/RELEASE_3_4_1.md" = "web_search_plus_mcp/docs/RELEASE_3_4_1.md"
"docs/RELEASE_3_5_0.md" = "web_search_plus_mcp/docs/RELEASE_3_5_0.md"
"wsp_sdk" = "wsp_sdk"

[project]
name = "web-search-plus-mcp"
version = "4.1.1"
description = "Source-only multi-provider web search, extraction, evidence receipts, and onboarding for MCP clients"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0,<3", "httpx2>=2.5.0", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
test = [
  "pytest",
  "ruff==0.15.12",
  "tomli; python_version < '3.11'",
]

[project.scripts]
web-search-plus-mcp = "web_search_plus_mcp.server:cli_main"

[project.urls]
Homepage = "https://websearchplus.xyz"
Repository = "https://github.com/robbyczgw-cla/web-search-plus-mcp"
Documentation = "https://websearchplus.xyz"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
